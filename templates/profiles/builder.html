{% extends 'base.html' %}
{% load i18n %}
{% block title %}{% translate "Конструктор резюме" %} | StudCareer{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto py-12 px-4">
    <h1 class="text-3xl font-bold mb-8">{% translate "Создание профиля (Резюме)" %}</h1>
    <form method="post" class="bg-white shadow rounded-lg p-6 space-y-6">
        {% csrf_token %}
        <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
            <div>
                <label class="block text-sm font-medium text-gray-700">{% translate "ФИО" %}</label>
                <input type="text" name="full_name" value="{{ profile.full_name }}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 border p-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">{% translate "Желаемая должность" %}</label>
                <input type="text" name="headline" value="{{ profile.headline }}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 border p-2">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">{% translate "О себе" %}</label>
            <textarea name="about" rows="4" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 border p-2">{{ profile.about }}</textarea>
        </div>

        <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
            <div>
                <label class="block text-sm font-medium text-gray-700">{% translate "Вуз / Колледж" %}</label>
                <input type="text" name="institution" value="{{ profile.institution }}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 border p-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">{% translate "Специальность" %}</label>
                <input type="text" name="specialty" value="{{ profile.specialty }}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 border p-2">
            </div>
        </div>

        <div class="flex justify-end">
            <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">{% translate "Сохранить и посмотреть" %}</button>
        </div>
    </form>
</div>
{% endblock %}
