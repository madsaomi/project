{% extends 'base.html' %}
{% block title %}Профиль: {{ profile.full_name }} | StudCareer{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto py-12 px-4">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold">Просмотр резюме</h1>
        <div class="space-x-4">
            <a href="{% url 'profiles:builder' %}" class="text-indigo-600 hover:underline font-medium">Редактировать</a>
            <a href="{% url 'profiles:export_pdf' profile.pk %}" class="bg-red-600 text-white px-4 py-2 rounded shadow hover:bg-red-700">Скачать PDF</a>
            <a href="{% url 'profiles:export_docx' profile.pk %}" class="bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700">Скачать DOCX</a>
        </div>
    </div>
    <div class="bg-white shadow rounded-lg border border-gray-200 overflow-hidden">
        {% include 'profiles/themes/classic.html' with profile=profile %}
    </div>
</div>
{% endblock %}
