<div class="space-y-4 flex flex-col justify-end min-h-full">
    {% for msg in messages %}
        <div class="flex {% if msg.sender == user %}justify-end{% else %}justify-start{% endif %}">
            <div class="max-w-[70%] rounded-2xl px-4 py-2 shadow-sm
                {% if msg.sender == user %}
                    bg-indigo-600 text-white rounded-br-none
                {% else %}
                    bg-white text-gray-900 rounded-bl-none border border-gray-100
                {% endif %}
            ">
                <p class="text-sm">{{ msg.content }}</p>
                <div class="text-[10px] mt-1 text-right
                    {% if msg.sender == user %}text-indigo-200{% else %}text-gray-400{% endif %}
                ">
                    {{ msg.created_at|date:"H:i" }}
                    {% if msg.sender == user and msg.is_read %}
                        <i data-lucide="check-check" class="inline w-3 h-3 ml-1"></i>
                    {% endif %}
                </div>
            </div>
        </div>
    {% empty %}
        <div class="text-center text-sm text-gray-500 py-8">
            Напишите первое сообщение...
        </div>
    {% endfor %}
</div>

<!-- Auto-scroll to bottom script injected with htmx response -->
<script>
    setTimeout(() => {
        const feed = document.getElementById('message-feed');
        if (feed) {
            feed.scrollTop = feed.scrollHeight;
        }
        // Re-init lucide icons for newly loaded content
        if (window.lucide) {
            window.lucide.createIcons();
        }
    }, 50);
</script>
