{% extends 'base.html' %}
{% block title %}Профиль компании | StudCareer{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto py-12 px-4">
    <h1 class="text-3xl font-bold mb-8">Профиль компании</h1>
    <form method="post" class="bg-white shadow rounded-lg p-6 space-y-6">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700">Название компании</label>
            <input type="text" name="name" value="{{ company.name }}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 border p-2">
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-700">Описание</label>
            <textarea name="description" rows="4" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 border p-2">{{ company.description }}</textarea>
        </div>

        <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
            <div>
                <label class="block text-sm font-medium text-gray-700">Отрасль</label>
                <input type="text" name="industry" value="{{ company.industry }}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 border p-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Сайт</label>
                <input type="url" name="website" value="{{ company.website }}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 border p-2">
            </div>
        </div>

        <div class="flex justify-end">
            <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">Сохранить</button>
        </div>
    </form>
</div>
{% endblock %}
