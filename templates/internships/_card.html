<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 hover:shadow-md transition-shadow group">
    <div class="flex flex-col sm:flex-row gap-4 items-start sm:items-center">
        <!-- Company Logo -->
        <div class="flex-shrink-0 w-16 h-16 rounded-lg bg-gray-50 border border-gray-100 flex items-center justify-center overflow-hidden">
            {% if internship.company.logo %}
                <img src="{{ internship.company.logo.url }}" alt="{{ internship.company.name }}" class="w-full h-full object-cover">
            {% else %}
                <i data-lucide="building-2" class="w-8 h-8 text-gray-400"></i>
            {% endif %}
        </div>
        
        <!-- Details -->
        <div class="flex-grow">
            <h3 class="text-xl font-bold text-gray-900 group-hover:text-indigo-600 transition-colors">
                <a href="{% url 'internships:detail' internship.slug %}" class="focus:outline-none">
                    <span class="absolute inset-0" aria-hidden="true"></span>
                    {{ internship.title }}
                </a>
            </h3>
            <p class="text-sm font-medium text-gray-600">{{ internship.company.name }}</p>
            
            <div class="mt-2 flex flex-wrap gap-2 text-xs text-gray-500">
                <span class="inline-flex items-center gap-1">
                    <i data-lucide="map-pin" class="w-3.5 h-3.5"></i>
                    {{ internship.get_work_format_display }}
                </span>
                <span class="inline-flex items-center gap-1">
                    <i data-lucide="clock" class="w-3.5 h-3.5"></i>
                    {{ internship.get_internship_type_display }}
                </span>
                {% if internship.is_paid %}
                    <span class="inline-flex items-center gap-1 text-green-600 font-medium bg-green-50 px-2 py-0.5 rounded-full">
                        <i data-lucide="banknote" class="w-3.5 h-3.5"></i>
                        Оплачиваемая
                    </span>
                {% endif %}
            </div>
        </div>
        
        <!-- Action Button -->
        <div class="flex-shrink-0 sm:self-center mt-4 sm:mt-0 relative z-10">
            <a href="{% url 'internships:detail' internship.slug %}" class="inline-flex items-center justify-center px-4 py-2 border border-transparent text-sm font-medium rounded-lg text-indigo-700 bg-indigo-50 hover:bg-indigo-100 transition-colors">
                Подробнее
            </a>
        </div>
    </div>
</div>
