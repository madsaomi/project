{% extends 'base.html' %}

{% block title %}Каталог стажировок{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
    <div class="flex flex-col md:flex-row gap-8">
        
        <!-- Sidebar with filters -->
        <div class="w-full md:w-1/4">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 sticky top-24">
                <h2 class="text-lg font-semibold text-gray-900 mb-4">Фильтры</h2>
                
                <form id="filter-form" hx-get="{% url 'internships:catalog' %}" hx-target="#internships-list" hx-trigger="change">
                    <div class="mb-6">
                        <h3 class="text-sm font-medium text-gray-700 mb-3">Формат работы</h3>
                        <div class="space-y-2">
                            <label class="flex items-center">
                                <input type="radio" name="work_format" value="" class="text-indigo-600 focus:ring-indigo-500 rounded-full" checked>
                                <span class="ml-2 text-sm text-gray-600">Все</span>
                            </label>
                            <label class="flex items-center">
                                <input type="radio" name="work_format" value="office" class="text-indigo-600 focus:ring-indigo-500 rounded-full">
                                <span class="ml-2 text-sm text-gray-600">Офис</span>
                            </label>
                            <label class="flex items-center">
                                <input type="radio" name="work_format" value="remote" class="text-indigo-600 focus:ring-indigo-500 rounded-full">
                                <span class="ml-2 text-sm text-gray-600">Удалённо</span>
                            </label>
                            <label class="flex items-center">
                                <input type="radio" name="work_format" value="hybrid" class="text-indigo-600 focus:ring-indigo-500 rounded-full">
                                <span class="ml-2 text-sm text-gray-600">Гибрид</span>
                            </label>
                        </div>
                    </div>
                    
                    <div>
                        <h3 class="text-sm font-medium text-gray-700 mb-3">Оплата</h3>
                        <label class="flex items-center">
                            <input type="checkbox" name="is_paid" value="true" class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500">
                            <span class="ml-2 text-sm text-gray-600">Оплачиваемая</span>
                        </label>
                    </div>
                </form>
            </div>
        </div>

        <!-- Main Content (List) -->
        <div class="w-full md:w-3/4">
            <div class="flex justify-between items-end mb-6">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900">Каталог стажировок</h1>
                    <p class="mt-2 text-sm text-gray-500">Найдите идеальную стажировку для старта карьеры</p>
                </div>
            </div>
            
            <div id="internships-list">
                {% include 'internships/_list.html' %}
            </div>
        </div>
        
    </div>
</div>
{% endblock %}
