{% extends 'base.html' %}

{% block title %}Новая стажировка{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 sm:p-10">
        <div class="mb-8">
            <h1 class="text-2xl font-bold text-gray-900">Публикация стажировки</h1>
            <p class="mt-2 text-sm text-gray-500">Заполните детали, чтобы привлечь лучших студентов.</p>
        </div>
        
        <form method="post" action="." class="space-y-6">
            {% csrf_token %}
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Название (должность)</label>
                    <input type="text" name="title" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Тип занятости</label>
                        <select name="internship_type" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                            <option value="internship">Стажировка</option>
                            <option value="part_time">Подработка</option>
                            <option value="project">Проектная работа</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Формат работы</label>
                        <select name="work_format" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                            <option value="office">Офис</option>
                            <option value="remote">Удалённо</option>
                            <option value="hybrid">Гибрид</option>
                        </select>
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700">Описание</label>
                    <textarea name="description" rows="4" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"></textarea>
                </div>
                
                <div class="flex items-center gap-4">
                    <label class="flex items-center">
                        <input type="checkbox" name="is_paid" value="true" class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500">
                        <span class="ml-2 text-sm text-gray-700">Оплачиваемая</span>
                    </label>
                </div>
            </div>
            
            <div class="pt-6 border-t border-gray-100 flex justify-end gap-3">
                <a href="{% url 'internships:dashboard' %}" class="px-4 py-2 border border-gray-300 shadow-sm text-sm font-medium rounded-lg text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
                    Отмена
                </a>
                <button type="submit" class="px-4 py-2 border border-transparent shadow-sm text-sm font-medium rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
                    Опубликовать
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
