<div x-data="{ show: false, message: '', type: 'success' }"
     @show-toast.window="show = true; message = $event.detail.message; type = $event.detail.type || 'success'; setTimeout(() => show = false, 3000)"
     x-show="show"
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0 transform translate-y-2"
     x-transition:enter-end="opacity-100 transform translate-y-0"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100 transform translate-y-0"
     x-transition:leave-end="opacity-0 transform translate-y-2"
     class="fixed bottom-4 right-4 z-50 p-4 rounded-xl shadow-lg flex items-center gap-3"
     :class="{'bg-emerald-50 text-emerald-800 border border-emerald-200': type === 'success', 'bg-red-50 text-red-800 border border-red-200': type === 'error'}">
    
    <span x-show="type === 'success'" class="text-emerald-500">✓</span>
    <span x-show="type === 'error'" class="text-red-500">⚠</span>
    
    <p x-text="message" class="text-sm font-medium"></p>
</div>
