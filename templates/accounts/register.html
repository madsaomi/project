{% extends 'base.html' %}
{% block title %}Регистрация | StudCareer{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-16 p-8 bg-white shadow-xl rounded-2xl border border-slate-100">
    <h2 class="text-2xl font-bold text-center text-slate-900 mb-6">Регистрация</h2>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-slate-700">Email</label>
            <input type="email" name="email" class="mt-1 block w-full rounded-lg border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border" required>
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700">Роль</label>
            <select name="role" class="mt-1 block w-full rounded-lg border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border">
                <option value="student">Студент</option>
                <option value="employer">Работодатель</option>
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700">Пароль</label>
            <input type="password" name="password" class="mt-1 block w-full rounded-lg border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border" required>
        </div>
        <button type="submit" class="w-full bg-indigo-600 text-white font-medium py-2 px-4 rounded-lg hover:bg-indigo-700 transition">Зарегистрироваться</button>
    </form>
</div>
{% endblock %}
