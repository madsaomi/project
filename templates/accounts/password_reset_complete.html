{% extends 'base.html' %}
{% load i18n %}
{% block title %}{% translate "Пароль изменён" %} | StudCareer{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-16 p-8 bg-white shadow-xl rounded-2xl border border-slate-100 text-center">
    <i data-lucide="check-circle" class="mx-auto w-12 h-12 text-green-600"></i>
    <h2 class="text-2xl font-bold text-slate-900 mt-4">{% translate "Пароль изменён" %}</h2>
    <p class="text-sm text-slate-500 mt-3">{% translate "Теперь войдите с новым паролем." %}</p>
    <a href="{% url 'accounts:login' %}" class="mt-6 inline-block bg-indigo-600 text-white font-medium py-2 px-6 rounded-lg hover:bg-indigo-700 transition">{% translate "Войти" %}</a>
</div>
{% endblock %}
