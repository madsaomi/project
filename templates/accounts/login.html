{% extends 'base.html' %}
{% load i18n %}
{% block title %}{% translate "Вход" %} | StudCareer{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-16 p-8 bg-white shadow-xl rounded-2xl border border-slate-100">
    <h2 class="text-2xl font-bold text-center text-slate-900 mb-6">{% translate "Вход в аккаунт" %}</h2>
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {% if error %}
        <div class="rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3">{{ error }}</div>
        {% endif %}
        <div>
            <label class="block text-sm font-medium text-slate-700">Email</label>
            <input type="email" name="email" class="mt-1 block w-full rounded-lg border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border" required>
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700">{% translate "Пароль" %}</label>
            <input type="password" name="password" class="mt-1 block w-full rounded-lg border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 p-2 border" required>
        </div>
        <button type="submit" class="w-full bg-indigo-600 text-white font-medium py-2 px-4 rounded-lg hover:bg-indigo-700 transition">{% translate "Войти" %}</button>
    </form>
    <p class="mt-6 text-sm text-center text-slate-500">
        <a href="{% url 'accounts:password_reset' %}" class="text-indigo-600 hover:underline">{% translate "Забыли пароль?" %}</a>
    </p>
</div>
{% endblock %}
